[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "xuanpian"
version = "0.1.0"
description = "AI-powered photo selection assistant"
license = "GPL-3.0-only"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "packaging/licenses/**/*.txt", "packaging/licenses/*.txt", "packaging/notice-manifest.json", "packaging/third-party-components.json"]
requires-python = ">=3.11"
dependencies = [
    "numpy==2.2.6",
    "onnxruntime==1.19.2",
    "rawpy==0.24.0",
    "Pillow==13.0.0",
    "PyQt6==6.7.1",
    "PyQt6-Qt6==6.7.3",
]

[project.optional-dependencies]
formats = ["pillow-heif"]
test = ["pytest", "pytest-qt"]
build = ["pip", "wheel", "setuptools>=77", "pyinstaller==6.21.0"]

[project.scripts]
xuanpian = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
"src.xuanpian.resources" = ["icons/*.png", "models/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
