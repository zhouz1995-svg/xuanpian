name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: macOS arm64 test
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # GitHub's macOS 15 arm64 tool cache currently provides 3.11.9.
          # Release packaging remains pinned to CPython 3.11.15.
          python-version: "3.11.9"
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r packaging/requirements-macos-arm64.lock
      - name: Check dependency consistency
        run: python -m pip check
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -q

  engine-platforms:
    name: Engine tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.9"
          architecture: x64
      - name: Install engine and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Check dependency consistency
        run: python -m pip check
      - name: Run offline model and algorithm tests
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          python -m pytest -q
          tests/test_onnx_detection.py tests/test_onnx_backend.py
          tests/test_image_ops.py tests/test_focus_analyzer.py
          tests/test_af_focus.py tests/test_subject_locator.py
          tests/test_technical_analysis_contracts.py
